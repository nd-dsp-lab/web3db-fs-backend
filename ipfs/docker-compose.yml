services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs-public
    # network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./data/ipfs:/data/ipfs
    ports:
      - "5001:5001"   # API for FastAPI
      - "8082:8082"   # Public Gateway
      - "4001:4001"   # Swarm TCP
      - "4001:4001/udp" # Swarm UDP
    environment:
      - IPFS_PROFILE=server
      - IPFS_PATH=/data/ipfs
      - ANNOUNCE_IP=${ANNOUNCE_IP:-}
      # Extra multiaddr to announce alongside auto-detected ones. Used for the
      # EC2 reverse tunnel that makes this node publicly dialable from behind
      # the campus perimeter firewall (TCP only — ssh can't forward QUIC/UDP).
      - APPEND_ANNOUNCE_ADDR=${APPEND_ANNOUNCE_ADDR:-}
    entrypoint: >
      sh -c "
        ipfs init --profile server || true &&
        ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001 &&
        ipfs config Addresses.Gateway /ip4/0.0.0.0/tcp/8082 &&
        ipfs config --json Addresses.Swarm '[
          \"/ip4/0.0.0.0/tcp/4001\",
          \"/ip6/::/tcp/4001\",
          \"/ip4/0.0.0.0/udp/4001/quic-v1\",
          \"/ip6/::/udp/4001/quic-v1\",
          \"/ip4/0.0.0.0/udp/4001/webrtc-direct\",
          \"/ip6/::/udp/4001/webrtc-direct\"
        ]' &&
        if [ -n \"$ANNOUNCE_IP\" ]; then
          ipfs config --json Addresses.Announce \"[
            \\\"/ip4/${ANNOUNCE_IP}/tcp/4001\\\",
            \\\"/ip4/${ANNOUNCE_IP}/udp/4001/quic-v1\\\"
          ]\"
        else
          ipfs config --json Addresses.Announce '[]'
        fi &&
        if [ -n \"$APPEND_ANNOUNCE_ADDR\" ]; then
          ipfs config --json Addresses.AppendAnnounce \"[\\\"${APPEND_ANNOUNCE_ADDR}\\\"]\"
        else
          ipfs config --json Addresses.AppendAnnounce '[]'
        fi &&
        ipfs config --json Swarm.DisableNatPortMap false &&
        ipfs config --json Swarm.RelayClient '{\"Enabled\": true, \"StaticRelays\": []}' &&
        ipfs config --json Swarm.RelayService '{\"Enabled\": false}' &&
        ipfs config --json Swarm.EnableHolePunching true &&
        ipfs config --json AutoNAT '{}' &&
        ipfs config --json Discovery.MDNS '{\"Enabled\": false}' &&
        ipfs config Datastore.StorageMax $$(df -P -B1 /data/ipfs | tail -1 | awk '{print $$4}') &&
        ipfs daemon --migrate --routing=dhtclient
      "
    # StorageMax is free space on the volume at startup, not the volume's total
    # size: the disk carries the OS and everything else on this host, so total
    # size would promise storage that isn't there. Free space is also what makes
    # StorageMax - RepoSize meaningful — the sidebar shows that as the space
    # left, and every byte the repo gains is a byte the disk loses, so the
    # subtraction stays true as the repo grows. It goes stale only when
    # something *else* on the host grows; restarting this service re-reads it.

  # Garbage collection runs here rather than via the daemon's --enable-gc.
  # That flag only sweeps once the repo passes 90% of Datastore.StorageMax,
  # which the repo will not reach until the disk is nearly full — far too late
  # to be the only sweep. Unpinned blocks (DHT cache, and the transient adds in
  # the upload dedup path) would sit unswept until then.
  #
  # Daily, not hourly: /upload adds a block unpinned, checks the chain for a
  # duplicate, then pins. A sweep landing in that window drops the block out
  # from under the pin. The window is short and the traffic is low, so fewer
  # sweeps means fewer chances to hit it.
  ipfs-gc:
    image: ipfs/kubo:latest
    container_name: ipfs-gc
    restart: unless-stopped
    depends_on: [ipfs]
    # The image's healthcheck probes a daemon on this container's own
    # localhost. There isn't one here — only a sleep loop that talks to the
    # daemon next door — so it would report unhealthy forever.
    healthcheck:
      disable: true
    entrypoint: >
      sh -c "
        while true; do
          sleep 86400
          ipfs --api /dns4/ipfs/tcp/5001 repo gc || echo 'gc failed, retrying tomorrow'
        done
      "



