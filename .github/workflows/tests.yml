name: tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The suite is hermetic: conftest sets a dummy contract address and an
      # unreachable RPC URL before any app module loads, so no .env, IPFS node
      # or Sepolia access is needed here.
      - run: pytest -q
