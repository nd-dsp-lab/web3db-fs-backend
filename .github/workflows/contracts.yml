name: contracts

on:
  push:
    branches: [develop, main]
    paths: ["smart-contracts/**"]
  pull_request:
    branches: [develop, main]
    paths: ["smart-contracts/**"]

defaults:
  run:
    working-directory: smart-contracts

jobs:
  hardhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json

      - run: npm ci

      # Runs against Hardhat's in-process network — no INFURA/PRIVATE_KEY
      # needed. hardhat.config.js logs those as "Missing" and carries on; the
      # sepolia network entry is only used by deploy scripts, not the tests.
      - run: npx hardhat test
