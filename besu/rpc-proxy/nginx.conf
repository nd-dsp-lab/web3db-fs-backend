# Public JSON-RPC endpoint for the Besu QBFT network (chain 20260928).
#
# Why this exists:
#   1. fs.web3db.org is served over HTTPS, so a browser refuses to call a
#      plain http:// RPC (mixed content). The endpoint the frontend is built
#      against must therefore be HTTPS.
#   2. Besu runs with --host-allowlist=localhost,127.0.0.1,node1, which rejects
#      any request whose Host header is not in that list. Rewriting the Host
#      header to "localhost" here is what makes an external caller work.
#
# Install on the Besu host (129.74.154.215):
#   sudo cp nginx.conf /etc/nginx/sites-available/rpc.web3db.org
#   sudo ln -s /etc/nginx/sites-available/rpc.web3db.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rpc.web3db.org     # turns this into an HTTPS block
#
# Only a port-80 block is defined on purpose: `certbot --nginx` clones this
# block, adds listen 443 + ssl_certificate, and inserts the http->https
# redirect. Defining 443 by hand first would make `nginx -t` fail on the
# missing certificate.
#
# Prerequisite outside nginx: an A record rpc.web3db.org -> 129.74.154.215.

server {
    listen 80;
    server_name rpc.web3db.org;

    # Only the site itself may call this from a browser. MetaMask signs
    # locally, so the RPC only needs to serve reads and tx broadcasts.
    set $cors_origin "";
    if ($http_origin ~* ^https://(fs\.web3db\.org|www\.web3db\.org)$) {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Max-Age       86400 always;

    location / {
        # Preflight never reaches Besu.
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;

        # The allowlist Besu enforces is on the Host header, so it must be
        # rewritten to an allowlisted value -- not passed through as
        # rpc.web3db.org.
        proxy_set_header Host localhost;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
